<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Spice Management System preview placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#451a03" />
      <stop offset="0.6" stop-color="#92400e" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#fffbeb" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />
  <circle cx="140" cy="90" r="220" fill="#fcd34d" fill-opacity="0.18" />
  <circle cx="1080" cy="620" r="260" fill="#fb923c" fill-opacity="0.16" />

  <g font-family="'Segoe UI', Inter, system-ui, sans-serif">
    <text x="92" y="150" fill="#fde68a" font-size="22" font-weight="700" letter-spacing="6">WEB APP · 2026</text>
    <text x="90" y="222" fill="#ffffff" font-size="56" font-weight="800" letter-spacing="-1.5">Spice Management</text>
    <text x="90" y="286" fill="#ffffff" font-size="56" font-weight="800" letter-spacing="-1.5">System</text>
    <text x="92" y="342" fill="#fde68a" fill-opacity="0.95" font-size="24">Stock, sales and supplier records in one place</text>
  </g>

  <g transform="translate(88 392)" font-family="'Segoe UI', Inter, system-ui, sans-serif">
    <rect width="150" height="86" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.25" />
    <text x="24" y="42" fill="#ffffff" font-size="30" font-weight="800">248 kg</text>
    <text x="24" y="66" fill="#fde68a" font-size="16">in stock</text>

    <rect x="170" width="150" height="86" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.25" />
    <text x="194" y="42" fill="#ffffff" font-size="30" font-weight="800">36</text>
    <text x="194" y="66" fill="#fde68a" font-size="16">suppliers</text>
  </g>

  <!-- dashboard mock -->
  <g transform="translate(660 112)">
    <rect width="460" height="452" rx="24" fill="url(#panel)" />

    <g font-family="'Segoe UI', Inter, system-ui, sans-serif">
      <text x="34" y="52" fill="#78350f" font-size="20" font-weight="800">Dashboard</text>
      <rect x="330" y="30" width="96" height="30" rx="15" fill="#f59e0b" />
      <text x="378" y="50" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">+ New sale</text>
    </g>

    <g transform="translate(34 76)" font-family="'Segoe UI', Inter, system-ui, sans-serif">
      <rect width="120" height="76" rx="16" fill="#fef3c7" />
      <text x="18" y="34" fill="#92400e" font-size="12" font-weight="700" letter-spacing="1">STOCK</text>
      <text x="18" y="60" fill="#78350f" font-size="22" font-weight="800">248 kg</text>

      <rect x="132" width="120" height="76" rx="16" fill="#ecfdf5" />
      <text x="150" y="34" fill="#047857" font-size="12" font-weight="700" letter-spacing="1">SALES</text>
      <text x="150" y="60" fill="#065f46" font-size="22" font-weight="800">LKR 84k</text>

      <rect x="264" width="120" height="76" rx="16" fill="#fff1f2" />
      <text x="282" y="34" fill="#be123c" font-size="12" font-weight="700" letter-spacing="1">ORDERS</text>
      <text x="282" y="60" fill="#881337" font-size="22" font-weight="800">12</text>
    </g>

    <!-- table -->
    <g transform="translate(34 176)" font-family="'Segoe UI', Inter, system-ui, sans-serif">
      <rect width="392" height="240" rx="16" fill="#ffffff" stroke="#fde68a" />
      <rect x="0" y="0" width="392" height="42" rx="16" fill="#fffbeb" />
      <text x="20" y="27" fill="#92400e" font-size="12" font-weight="700" letter-spacing="1">PRODUCT</text>
      <text x="190" y="27" fill="#92400e" font-size="12" font-weight="700" letter-spacing="1">STOCK</text>
      <text x="290" y="27" fill="#92400e" font-size="12" font-weight="700" letter-spacing="1">SUPPLIER</text>

      <g fill="#e2e8f0">
        <rect x="20" y="62" width="110" height="10" rx="5" />
        <rect x="190" y="62" width="46" height="10" rx="5" />
        <rect x="290" y="62" width="74" height="10" rx="5" />
        <rect x="20" y="102" width="88" height="10" rx="5" />
        <rect x="190" y="102" width="46" height="10" rx="5" />
        <rect x="290" y="102" width="60" height="10" rx="5" />
        <rect x="20" y="142" width="124" height="10" rx="5" />
        <rect x="190" y="142" width="46" height="10" rx="5" />
        <rect x="290" y="142" width="82" height="10" rx="5" />
        <rect x="20" y="182" width="96" height="10" rx="5" />
        <rect x="190" y="182" width="46" height="10" rx="5" />
        <rect x="290" y="182" width="68" height="10" rx="5" />
      </g>

      <g fill="#f59e0b" fill-opacity="0.9">
        <circle cx="176" cy="67" r="4" />
        <circle cx="176" cy="107" r="4" />
        <circle cx="176" cy="147" r="4" />
        <circle cx="176" cy="187" r="4" />
      </g>
    </g>
  </g>
</svg>
