<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Secure Event Management System preview placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e26" />
      <stop offset="0.6" stop-color="#065f46" />
      <stop offset="1" stop-color="#10b981" />
    </linearGradient>
